<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Start planning your perfect event with WTFun. Tell us your idea and we'll help you discover amazing activities and experiences.">
    <meta name="theme-color" content="#007bff">
    <meta name="robots" content="index, follow">
    <meta name="keywords" content="event planning, start plan, party planning, activities, experiences, event ideas">
    <title>Start a Plan - WTFun Event Planning</title>
    <link rel="canonical" href="https://whatthefun.wtf/start-a-plan.html">
    <link rel="icon" href="data:;" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://whatthefun.wtf/start-a-plan.html">
    <meta property="og:title" content="Start a Plan - WTFun Event Planning">
    <meta property="og:description" content="Start planning your perfect event with WTFun. Tell us your idea and we'll help you discover amazing activities and experiences.">
    <meta property="og:image" content="https://res.cloudinary.com/dxvlilrqq/image/upload/v1/wtfun/og-image.jpg">
    <meta property="og:site_name" content="WTFun">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://whatthefun.wtf/start-a-plan.html">
    <meta name="twitter:title" content="Start a Plan - WTFun Event Planning">
    <meta name="twitter:description" content="Start planning your perfect event with WTFun. Tell us your idea and we'll help you discover amazing activities and experiences.">
    <meta name="twitter:image" content="https://res.cloudinary.com/dxvlilrqq/image/upload/v1/wtfun/og-image.jpg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 48px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 32px;
            line-height: 1.2;
        }

        .input-wrapper {
            margin-bottom: 24px;
        }

        #planIdea {
            width: 100%;
            min-height: 120px;
            padding: 20px;
            font-size: 1.125rem;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            resize: vertical;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: inherit;
            line-height: 1.6;
        }

        #planIdea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        #planIdea::placeholder {
            color: #94a3b8;
        }

        #startPlanButton {
            width: 100%;
            padding: 18px 32px;
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        #startPlanButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }

        #startPlanButton:active:not(:disabled) {
            transform: translateY(0);
        }

        #startPlanButton:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #startPlanButton.loading {
            position: relative;
        }

        #startPlanButton.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-link {
            margin-top: 32px;
        }

        .footer-link a {
            color: #64748b;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .footer-link a:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .error-message {
            color: #dc2626;
            font-size: 0.9rem;
            margin-top: 12px;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        /* Debug Panel Styles - Mobile-friendly debugging */
        .debug-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 40vh;
            background-color: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 12px;
            overflow-y: auto;
            padding: 12px;
            z-index: 9999;
            display: none;
            border-top: 2px solid #00ff00;
        }

        .debug-panel.visible {
            display: block;
        }

        .debug-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #00ff0044;
        }

        .debug-panel-title {
            font-weight: bold;
            color: #00ff00;
        }

        .debug-panel-controls {
            display: flex;
            gap: 8px;
        }

        .debug-btn {
            background: none;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
        }

        .debug-btn:hover {
            background: #00ff0022;
        }

        .debug-entry {
            margin-bottom: 8px;
            padding: 8px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            word-break: break-word;
        }

        .debug-timestamp {
            color: #888;
            font-size: 10px;
        }

        .debug-action {
            color: #ffff00;
            font-weight: bold;
        }

        .debug-data {
            color: #00ffff;
            white-space: pre-wrap;
            margin-top: 4px;
        }

        .debug-error {
            color: #ff4444;
        }

        .debug-success {
            color: #44ff44;
        }

        .debug-toggle {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #333 0%, #111 100%);
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 20px;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .debug-toggle:hover {
            background: linear-gradient(135deg, #444 0%, #222 100%);
        }

        .debug-toggle.has-logs::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #ff4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Persisted logs from previous pages */
        .debug-entry-persisted {
            opacity: 0.7;
            border-left: 2px solid #888;
        }

        .debug-separator {
            text-align: center;
            margin: 12px 0;
            color: #888;
            font-size: 10px;
        }

        .debug-separator span {
            background: rgba(0, 0, 0, 0.9);
            padding: 0 12px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 1.75rem;
            }

            #planIdea {
                min-height: 100px;
                font-size: 1rem;
            }

            #startPlanButton {
                font-size: 1.1rem;
                padding: 16px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>How would you like to begin?</h1>

        <div class="input-wrapper">
            <textarea
                id="planIdea"
                placeholder="Add any idea, component, or detail to your plan."
                autofocus
            ></textarea>
        </div>

        <button id="startPlanButton" type="button">
            Start Plan
        </button>

        <div id="errorMessage" class="error-message"></div>

        <div class="footer-link">
            <a href="/?view=projects">Go to Active Plan List</a>
        </div>
    </div>

    <!-- Debug Toggle Button -->
    <button id="debugToggle" class="debug-toggle" title="Toggle Debug Panel">🔧</button>

    <!-- Debug Panel -->
    <div id="debugPanel" class="debug-panel">
        <div class="debug-panel-header">
            <span class="debug-panel-title">📋 Quick Plan Debug Log</span>
            <div class="debug-panel-controls">
                <button class="debug-btn" id="clearDebugLog">Clear</button>
                <button class="debug-btn" id="closeDebugPanel">✕</button>
            </div>
        </div>
        <div id="debugLogContent"></div>
    </div>

    <script>
        (function() {
            const planIdeaInput = document.getElementById('planIdea');
            const startPlanButton = document.getElementById('startPlanButton');
            const errorMessage = document.getElementById('errorMessage');

            // Debug Panel Elements
            const debugToggle = document.getElementById('debugToggle');
            const debugPanel = document.getElementById('debugPanel');
            const debugLogContent = document.getElementById('debugLogContent');
            const clearDebugLog = document.getElementById('clearDebugLog');
            const closeDebugPanel = document.getElementById('closeDebugPanel');

            // Debug state - Use same storage key as the shared debug-panel module
            const STORAGE_KEY = 'wtfun_debug_logs';
            const MAX_PERSISTED_LOGS = 500;
            let debugLogs = [];
            let enrichmentPollInterval = null;

            /**
             * Load persisted debug logs from sessionStorage
             */
            function loadPersistedLogs() {
                try {
                    const stored = sessionStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            return parsed;
                        }
                    }
                } catch (e) {
                    console.warn('[Debug Panel] Failed to load persisted logs:', e);
                }
                return [];
            }

            /**
             * Save debug logs to sessionStorage
             */
            function persistLogs() {
                try {
                    const logsToStore = debugLogs.slice(-MAX_PERSISTED_LOGS);
                    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(logsToStore));
                } catch (e) {
                    console.warn('[Debug Panel] Failed to persist logs:', e);
                }
            }

            /**
             * Escape HTML for safe display
             */
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            /**
             * Render a single log entry to the panel
             */
            function renderLogEntry(entry, isPersisted = false) {
                const entryEl = document.createElement('div');
                entryEl.className = 'debug-entry' + (isPersisted ? ' debug-entry-persisted' : '');

                let dataClass = '';
                if (entry.type === 'error') dataClass = 'debug-error';
                else if (entry.type === 'success') dataClass = 'debug-success';

                let html = `<div class="debug-timestamp">${entry.timestamp}</div>`;
                html += `<div class="debug-action ${dataClass}">[${entry.type.toUpperCase()}] ${escapeHtml(entry.action)}</div>`;

                if (entry.data !== null && entry.data !== undefined) {
                    const dataStr = typeof entry.data === 'object' ? JSON.stringify(entry.data, null, 2) : String(entry.data);
                    html += `<div class="debug-data">${escapeHtml(dataStr)}</div>`;
                }

                entryEl.innerHTML = html;
                debugLogContent.appendChild(entryEl);
            }

            /**
             * Render all persisted logs from sessionStorage
             */
            function renderPersistedLogs() {
                if (debugLogs.length === 0) return;

                // Add a separator to show these are from previous pages
                const separator = document.createElement('div');
                separator.className = 'debug-separator';
                separator.innerHTML = `<span>--- Logs from previous pages (${debugLogs.length} entries) ---</span>`;
                debugLogContent.appendChild(separator);

                // Render each persisted log
                for (const entry of debugLogs) {
                    renderLogEntry(entry, true);
                }

                // Add another separator
                const endSeparator = document.createElement('div');
                endSeparator.className = 'debug-separator';
                endSeparator.innerHTML = '<span>--- Current page logs below ---</span>';
                debugLogContent.appendChild(endSeparator);

                // Scroll to bottom
                debugPanel.scrollTop = debugPanel.scrollHeight;
            }

            /**
             * Add a debug log entry to the panel
             * @param {string} action - The action description
             * @param {any} data - Optional data to display
             * @param {string} type - 'info', 'success', 'error', 'data'
             */
            function debugLog(action, data = null, type = 'info') {
                const timestamp = new Date().toISOString();
                const entry = { timestamp, action, data, type };
                debugLogs.push(entry);

                // Persist to sessionStorage so logs survive page navigation
                persistLogs();

                // Add visual indicator if panel is closed
                if (!debugPanel.classList.contains('visible')) {
                    debugToggle.classList.add('has-logs');
                }

                // Render the entry
                renderLogEntry(entry, false);

                // Auto-scroll to bottom
                debugPanel.scrollTop = debugPanel.scrollHeight;

                // Also log to console
                const consoleMethod = type === 'error' ? 'error' : type === 'success' ? 'info' : 'log';
                console[consoleMethod](`[Debug] ${action}`, data || '');
            }

            /**
             * Toggle debug panel visibility
             */
            function toggleDebugPanel() {
                debugPanel.classList.toggle('visible');
                if (debugPanel.classList.contains('visible')) {
                    debugToggle.classList.remove('has-logs');
                }
            }

            /**
             * Clear all debug logs
             */
            function clearDebugLogs() {
                debugLogs = [];
                debugLogContent.innerHTML = '';
                // Also clear sessionStorage
                try {
                    sessionStorage.removeItem(STORAGE_KEY);
                } catch (e) {
                    console.warn('[Debug Panel] Failed to clear persisted logs:', e);
                }
                debugLog('Debug log cleared', null, 'info');
            }

            // Debug panel event listeners
            debugToggle.addEventListener('click', toggleDebugPanel);
            closeDebugPanel.addEventListener('click', () => debugPanel.classList.remove('visible'));
            clearDebugLog.addEventListener('click', clearDebugLogs);

            // Load persisted logs and render them
            debugLogs = loadPersistedLogs();
            if (debugLogs.length > 0) {
                renderPersistedLogs();
                debugToggle.classList.add('has-logs');
            }

            // Initialize debug log
            debugLog('Page loaded', { page: '/start-a-plan.html', persistedLogCount: debugLogs.length - 1, timestamp: Date.now() }, 'info');

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('visible');
                debugLog('Error shown to user', { message }, 'error');
            }

            function hideError() {
                errorMessage.classList.remove('visible');
            }

            function setLoading(isLoading) {
                startPlanButton.disabled = isLoading;
                if (isLoading) {
                    startPlanButton.classList.add('loading');
                    startPlanButton.textContent = '';
                    debugLog('Loading state enabled', null, 'info');
                } else {
                    startPlanButton.classList.remove('loading');
                    startPlanButton.textContent = 'Start Plan';
                    debugLog('Loading state disabled', null, 'info');
                }
            }

            /**
             * Poll for enrichment results after plan creation
             * @param {string} planId - The new plan ID
             */
            async function pollForEnrichment(planId) {
                debugLog('Starting enrichment polling', { planId }, 'info');

                let attempts = 0;
                const maxAttempts = 15; // Poll for up to 30 seconds
                const pollInterval = 2000; // Poll every 2 seconds

                enrichmentPollInterval = setInterval(async () => {
                    attempts++;
                    debugLog(`Enrichment poll attempt ${attempts}/${maxAttempts}`, { planId }, 'info');

                    try {
                        const response = await fetch(`/api/get-project?id=${planId}`);
                        if (response.ok) {
                            const project = await response.json();

                            // Check if enrichment fields are populated
                            const hasEnrichment = project.Goals || project.Date ||
                                                   (project.Name && project.Name.length < 50);

                            debugLog('Project data fetched', {
                                name: project.Name,
                                planType: project.Plan_Type,
                                date: project.Date,
                                goals: project.Goals,
                                guestCount: project['Guest Count'],
                                location: project.Location,
                                hasEnrichment
                            }, hasEnrichment ? 'success' : 'data');

                            if (hasEnrichment || attempts >= maxAttempts) {
                                clearInterval(enrichmentPollInterval);
                                if (hasEnrichment) {
                                    debugLog('AI Enrichment completed!', {
                                        extractedFields: {
                                            name: project.Name,
                                            type: project.Plan_Type,
                                            date: project.Date,
                                            goals: project.Goals,
                                            guestCount: project['Guest Count'],
                                            location: project.Location
                                        }
                                    }, 'success');
                                } else {
                                    debugLog('Max polling attempts reached', null, 'info');
                                }
                            }
                        }
                    } catch (error) {
                        debugLog('Enrichment poll error', { error: error.message }, 'error');
                    }
                }, pollInterval);
            }

            async function handleSubmit() {
                const idea = planIdeaInput.value.trim();

                debugLog('Submit initiated', {
                    ideaLength: idea.length,
                    ideaPreview: idea.substring(0, 100) + (idea.length > 100 ? '...' : '')
                }, 'info');

                if (!idea) {
                    showError('Please enter an idea to start your plan.');
                    planIdeaInput.focus();
                    return;
                }

                hideError();
                setLoading(true);

                try {
                    debugLog('Sending request to /api/create-quick-plan', {
                        ideaLength: idea.length
                    }, 'info');

                    const startTime = performance.now();
                    const response = await fetch('/api/create-quick-plan', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ idea: idea })
                    });
                    const endTime = performance.now();

                    debugLog('Response received', {
                        status: response.status,
                        statusText: response.statusText,
                        duration: `${(endTime - startTime).toFixed(0)}ms`
                    }, response.ok ? 'info' : 'error');

                    const data = await response.json();

                    debugLog('Response data parsed', data, response.ok ? 'success' : 'error');

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to create plan');
                    }

                    if (data.newPlanId) {
                        debugLog('Plan created successfully!', {
                            planId: data.newPlanId,
                            redirectUrl: '/?session=' + data.newPlanId
                        }, 'success');

                        // Start polling for enrichment results
                        pollForEnrichment(data.newPlanId);

                        // Show success and delay redirect to allow viewing debug output
                        debugLog('Redirecting to plan in 3 seconds...', null, 'info');
                        debugLog('(Tip: Keep debug panel open to see AI enrichment results)', null, 'info');

                        setTimeout(() => {
                            window.location.href = '/?session=' + data.newPlanId;
                        }, 3000);
                    } else {
                        throw new Error('No plan ID returned');
                    }
                } catch (error) {
                    debugLog('Request failed', {
                        error: error.message,
                        stack: error.stack
                    }, 'error');
                    console.error('Error creating plan:', error);
                    showError(error.message || 'Something went wrong. Please try again.');
                    setLoading(false);
                }
            }

            // Handle button click
            startPlanButton.addEventListener('click', handleSubmit);

            // Handle Enter key (Ctrl/Cmd+Enter for textarea)
            planIdeaInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    debugLog('Submit triggered via keyboard', { key: 'Ctrl/Cmd+Enter' }, 'info');
                    handleSubmit();
                }
            });

            // Log text input changes (debounced)
            let inputTimeout;
            planIdeaInput.addEventListener('input', function() {
                clearTimeout(inputTimeout);
                inputTimeout = setTimeout(() => {
                    debugLog('Input updated', {
                        length: planIdeaInput.value.length,
                        wordCount: planIdeaInput.value.trim().split(/\s+/).filter(w => w).length
                    }, 'info');
                }, 500);
            });
        })();
    </script>
</body>
</html>
