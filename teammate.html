<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teammate Profile</title>
    <link rel="stylesheet" href="teammate.css">
</head>
<body>
    <div class="profile-container">
        <header id="profile-header" class="card">
            <div id="loading-message">Loading Teammate Data...</div>
        </header>

        <main>
            <section id="performance-stats" class="card">
                <h2>Performance Snapshot 🚀</h2>
                <div class="stats-grid">
                    </div>
            </section>

            <section id="event-history" class="card">
                <h2>Event & Sales History 📈</h2>
                <div id="event-list">
                    </div>
            </section>
        </main>
        <footer>
            <a href="/crm.html">← Back to CRM Dashboard</a>
        </footer>
    </div>
    <script type="module" src="/dist/teammate.bundle.js"></script>
</body>
</html>
