<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store Dashboard</title>
</head>
<body>
    <div id="dashboard-wrapper" style="display: none;">
        <header>
            <h1 id="store-name-header">Loading Store...</h1>
        </header>
        <main>
            <h2>Store Settings</h2>
            <div id="store-settings-container"></div>

            <h2>Your Items</h2>
            <div id="item-list-container"></div>
        </main>
    </div>

    <script>
        const AUTH_KEY = 'store-dashboard-auth-token';
        const isAuthenticated = sessionStorage.getItem(AUTH_KEY);
        if (!isAuthenticated) {
            window.location.href = '/store-login.html';
        } else {
            document.getElementById('dashboard-wrapper').style.display = 'block';
        }
    </script>
    <script type="module" src="store-dashboard.js"></script>
</body>
</html>
