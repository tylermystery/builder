<body>
    <div class="main-container">
        <div id="left-sidebar">
            <div id="filter-controls">
                <h3>Filters</h3>
                
                <div id="date-filter-group" class="filter-group">
                    <label for="date-filter">Date & Time</label>
                    <input type="text" id="date-filter" placeholder="Select date and time range">
                    <div class="filter-btn-group" style="grid-template-columns: 1fr 1fr 1fr;">
                        <button class="filter-btn" data-date-quick="tomorrow">Tomorrow</button>
                        <button class="filter-btn" data-date-quick="this-week">This Week</button>
                        <button class="filter-btn" data-date-quick="next-2-weeks">Next 2 Weeks</button>
                    </div>
                </div>

                </div>
        </div>
        </div>
