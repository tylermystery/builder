[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# stripe-webhook (CommonJS) pulls in @netlify/database for the promotion
# redemption counter. That package exposes its drivers through a modern
# "exports" map (waddler/neon-http, waddler/node-postgres, pg, …) that the
# default zisi bundler cannot trace — it fails with EISDIR while walking the
# dependency tree. esbuild resolves the exports map natively, the same way the
# TypeScript functions that already talk to this database are bundled.
[functions."stripe-webhook"]
  node_bundler = "esbuild"

# Scheduled function: Daily Digest emails at 9 AM UTC
[functions."send-daily-digest"]
  schedule = "0 9 * * *"

# Scheduled function: Airtable backup to Netlify Blobs every 6 hours
[functions."airtable-backup"]
  schedule = "0 */6 * * *"

# Cache headers for static assets - improves repeat visit performance
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Allow remote images from Cloudinary for Netlify Image CDN
[images]
  remote_images = ["https://res.cloudinary.com/.*"]

# Edge function for SEO prerendering of item pages
# This runs BEFORE redirects and injects meta tags for crawlers
[[edge_functions]]
  path = "/item/*"
  function = "seo-prerender"

