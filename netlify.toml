# PASTE THIS ENTIRE CODE INTO: netlify.toml
[build]
  functions = "netlify/functions"

# Add the two new redirects for authentication
[[redirects]]
  from = "/api/auth-start"
  to = "/.netlify/functions/auth-start"
  status = 200

[[redirects]]
  from = "/api/auth-verify"
  to = "/.netlify/functions/auth-verify"
  status = 200

[[redirects]]
  from = "/api/auth-confirm"
  to = "/.netlify/functions/auth-confirm"
  status = 200

# Keep your existing redirects
[[redirects]]
  from = "/api/calendar"
  to = "/.netlify/functions/calendar"
  status = 200

[[redirects]]
  from = "/api/create-payment-intent"
  to = "/.netlify/functions/create-payment-intent"
  status = 200

[[redirects]]
  from = "/api/airtable/*"
  to = "/.netlify/functions/airtable"
  status = 200

[[redirects]]
  from = "/api/pusher-auth"
  to = "/.netlify/functions/pusher-auth"
  status = 200

[[redirects]]
  from = "/api/process-email"
  to = "/.netlify/functions/process-email"
  status = 200

[[redirects]]
  from = "/api/get-store-data-by-owner-id"
  to = "/.netlify/functions/get-store-data-by-owner-id"
  status = 200
